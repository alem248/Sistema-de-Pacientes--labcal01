# ===============================
# Configuracion - Sistema de Pacientes labcal01
# Herramientas: IntelliJ IDEA | XAMPP (MySQL) | SQLyog
# ===============================
spring.application.name=paciente

# --- DataSource MySQL (XAMPP) ---
# XAMPP por defecto: host localhost, puerto 3306, usuario root sin password
# Crear BD en SQLyog / phpMyAdmin: CREATE DATABASE db_pacientes CHARACTER SET utf8mb4;
spring.datasource.url=jdbc:mysql://localhost:3306/db_pacientes?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Thymeleaf ---
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# --- Multipart (fotografia paciente) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
paciente.upload-dir=uploads

# --- Server ---
server.port=8080

# --- SQL init (opcional) ---
# spring.sql.init.mode=always
