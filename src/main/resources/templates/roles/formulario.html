<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${esEdicion} ? 'Editar Rol' : 'Nuevo Rol'">Rol</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/pacientes"><i class="bi bi-hospital"></i> Sistema de Pacientes</a>
        <a href="/roles" class="btn btn-light btn-sm"><i class="bi bi-arrow-left"></i> Volver</a>
    </div>
</nav>

<div class="container mt-4">
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-white">
            <h4 class="mb-0">
                <i th:class="${esEdicion} ? 'bi bi-pencil-square' : 'bi bi-shield-plus'"></i>
                <span th:text="${esEdicion} ? 'Editar Rol' : 'Registro de Rol'"></span>
            </h4>
            <small class="text-muted">Roles m&iacute;nimos requeridos: ADMINISTRADOR, MEDICO, RECEPCIONISTA</small>
        </div>
        <div class="card-body">
            <form th:action="@{/roles/guardar}" th:object="${rol}" method="post" novalidate>
                <input type="hidden" th:field="*{id}">

                <div class="row g-3 mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Nombre del rol *</label>
                        <input type="text" class="form-control" th:field="*{nombre}" maxlength="30"
                               placeholder="ADMINISTRADOR / MEDICO / RECEPCIONISTA">
                        <small class="text-muted">Se guarda en may&uacute;sculas y debe ser &uacute;nico</small>
                    </div>
                    <div class="col-md-5">
                        <label class="form-label">Descripci&oacute;n</label>
                        <input type="text" class="form-control" th:field="*{descripcion}" maxlength="200"
                               placeholder="Qu&eacute; puede hacer este rol">
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" role="switch"
                                   id="activo" name="activo" value="true"
                                   th:checked="${rol.activo != null and rol.activo}">
                            <label class="form-check-label" for="activo">Rol activo</label>
                        </div>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Guardar</button>
                    <a href="/roles" class="btn btn-secondary"><i class="bi bi-x-circle"></i> Cancelar</a>
                </div>
            </form>
        </div>
    </div>

    <footer class="text-center text-muted mt-4 mb-4">
        <small>CRUD Roles | Evaluaci&oacute;n 02 - Nikolai Suarez</small>
    </footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
