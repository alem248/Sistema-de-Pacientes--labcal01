<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pacientes Registrados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <span class="navbar-brand mb-0 h1">Pacientes Registrados</span>
        <a th:href="@{/pacientes/nuevo}" class="btn btn-light btn-sm">+ Nuevo Paciente</a>
    </div>
</nav>
<div class="container mt-4">
    <div th:if="${pacientes == null || pacientes.isEmpty()}" class="alert alert-info">
        No hay pacientes registrados aún. <a th:href="@{/pacientes/nuevo}">Registrar el primero</a>
    </div>
    <div th:if="${pacientes != null && !pacientes.isEmpty()}" class="card shadow">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Lista de Pacientes (Solo visualización - RF-PAC-01/02)</h5>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Documento</th>
                            <th>Nombre Completo</th>
                            <th>F. Nacimiento</th>
                            <th>Edad</th>
                            <th>Sexo</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${pacientes}">
                            <td th:text="${p.id}"></td>
                            <td th:text="${p.tipoDocumento + ' ' + p.numeroDocumento}"></td>
                            <td th:text="${p.nombreCompleto}"></td>
                            <td th:text="${p.fechaNacimiento}"></td>
                            <td><span class="badge bg-primary" th:text="${p.edad + ' años'}"></span></td>
                            <td th:text="${p.sexo}"></td>
                            <td><span class="badge" th:classappend="${p.estado == 'Activo'} ? 'bg-success' : (p.estado == 'Inactivo' ? 'bg-warning text-dark' : 'bg-dark')" th:text="${p.estado}"></span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
