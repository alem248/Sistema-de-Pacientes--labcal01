<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nueva Cita - Sistema LabCal01</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/pacientes"><i class="bi bi-hospital"></i> Sistema de Pacientes</a>
        <a href="/citas" class="btn btn-light btn-sm"><i class="bi bi-arrow-left"></i> Volver</a>
    </div>
</nav>

<div class="container mt-4">
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-white">
            <h4 class="mb-0"><i class="bi bi-calendar-plus"></i> Registro de Cita</h4>
            <small class="text-muted">Seleccione el paciente y programe la cita</small>
        </div>
        <div class="card-body">
            <form th:action="@{/citas/guardar}" th:object="${cita}" method="post" novalidate>
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Paciente *</label>
                        <select class="form-select" name="pacienteId" required>
                            <option value="">-- Seleccione un paciente --</option>
                            <option th:each="p : ${pacientes}" th:value="${p.id}"
                                    th:text="${p.nombres + ' ' + p.apellidoPaterno + ' (' + p.numeroDocumento + ')'}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Fecha y hora *</label>
                        <input type="datetime-local" class="form-control" th:field="*{fechaHora}" required>
                    </div>
                    <div class="col-md-8">
                        <label class="form-label">Motivo *</label>
                        <input type="text" class="form-control" th:field="*{motivo}" maxlength="255"
                               placeholder="Consulta general, control, etc.">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">M&eacute;dico</label>
                        <input type="text" class="form-control" th:field="*{medico}" maxlength="150"
                               placeholder="Nombre del m&eacute;dico">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Estado</label>
                        <select class="form-select" th:field="*{estado}">
                            <option th:each="e : ${estados}" th:value="${e}" th:text="${e}"></option>
                        </select>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Guardar</button>
                    <a href="/citas" class="btn btn-secondary"><i class="bi bi-x-circle"></i> Cancelar</a>
                </div>
            </form>
        </div>
    </div>

    <footer class="text-center text-muted mt-4 mb-4">
        <small>Modulo Citas | Evaluaci&oacute;n 02 - Nikolai Suarez</small>
    </footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
