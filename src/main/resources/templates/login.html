<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar Sesión - Sistema de Pacientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height:100vh;">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <i class="bi bi-hospital text-primary" style="font-size:3rem;"></i>
                        <h4 class="mt-2">Sistema de Pacientes</h4>
                        <p class="text-muted small">Gestión de Pacientes - Evaluación 02</p>
                    </div>

                    <div th:if="${param.error != null}" class="alert alert-danger py-2">
                        <i class="bi bi-exclamation-triangle"></i> Usuario o contraseña incorrectos
                    </div>
                    <div th:if="${param.logout != null}" class="alert alert-success py-2">
                        <i class="bi bi-check-circle"></i> Sesión cerrada correctamente
                    </div>

                    <form method="post" th:action="@{/login}">
                        <div class="mb-3">
                            <label class="form-label" for="username">Usuario</label>
                            <input type="text" class="form-control" id="username" name="username" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="password">Contraseña</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-box-arrow-in-right"></i> Ingresar
                        </button>
                    </form>

                    <hr>
                    <div class="small text-muted">
                        <strong>Usuarios de demostración:</strong>
                        <ul class="mb-0">
                            <li><code>admin / admin123</code> — ADMINISTRADOR</li>
                            <li><code>medico / medico123</code> — MÉDICO</li>
                            <li><code>recepcionista / recep123</code> — RECEPCIONISTA</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
