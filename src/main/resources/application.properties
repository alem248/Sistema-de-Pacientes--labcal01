spring.application.name=paciente

# ===============================
# Configuracion integrada - Sistema de Pacientes labcal01
# Req.05-06 (REST) + RF-PAC-03/04 (MVC Thymeleaf companero)
# BD unificada: sistema_pacientes (ver sql/pacientes.sql)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/sistema_pacientes?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# === JPA / Hibernate ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# open-in-view=true para compatibilidad con Thymeleaf MVC del companero
# (los endpoints REST usan DTOs + @Transactional, no se ven afectados)
spring.jpa.open-in-view=true

# --- Thymeleaf (modulo MVC companero) ---
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# --- Multipart (fotografia paciente, modulo companero) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
paciente.upload-dir=uploads

# --- Server (8081 porque 8080 lo ocupa Oracle TNS en esta maquina; en laboratorio usar 8080 si esta libre) ---
server.port=8081
